apply plugin: 'com.android.application'

android {
    namespace 'com.sushidays'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sushidays'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

task copyAndroidNatives {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { arch ->
            file("libs/${arch}").mkdirs()
        }
        configurations.natives.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def name = artifact.file.name
            def outputDir = null
            if (name.contains('natives-armeabi-v7a')) outputDir = file('libs/armeabi-v7a')
            if (name.contains('natives-arm64-v8a'))   outputDir = file('libs/arm64-v8a')
            if (name.contains('natives-x86_64'))       outputDir = file('libs/x86_64')
            else if (name.contains('natives-x86'))     outputDir = file('libs/x86')
            if (outputDir != null) {
                copy {
                    from zipTree(artifact.file)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn copyAndroidNatives
    }
}